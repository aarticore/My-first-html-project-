<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body bgcolor="lightpink">

<center>
    <h1>Student Registration Form</h1>
</center>

<form>

<label>Name:</label>
<input type="text" name="student_name">
<br><br>

<label>Roll No:</label>
<input type="number" name="roll_no">
<br><br>

<label>Father's Name:</label>
<input type="text" name="father_name">
<br><br>

<label>Date of Birth:</label>
<input type="date" name="dob">
<br><br>

<label>Phone Number:</label>
<input type="text" placeholder="+91" size="3">
<input type="tel" placeholder="9876543210">
<br><br>

<label>Email:</label>
<input type="email" name="email">
<br><br>

<label>Password:</label>
<input type="password" name="password">
<br><br>

<label>Gender:</label>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
<br><br>

<label>Department:</label>
<input type="checkbox" name="department" value="CS"> CS
<input type="checkbox" name="department" value="IT"> IT
<input type="checkbox" name="department" value="ECE"> ECE
<br><br>

<label>Course Applied For:</label>
<select name="course">
    <option>MCA</option>
    <option>BCA</option>
    <option>B.Sc</option>
    <option>MBA</option>
</select>
<br><br>

<label>Choose Image:</label>
<input type="file" accept="image/*">
<br><br>

<label>City:</label>
<input type="text" placeholder="Chandigarh">
<br><br>

<label>Address:</label><br>
<textarea rows="5" cols="30"></textarea>
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
